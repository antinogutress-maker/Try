<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynamic MCQ Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00E5FF; 
            --secondary: #B400FB; 
            --accent: #FFEA00; 
            --glass-bg: rgba(255, 255, 255, 0.1); 
            --glass-border: rgba(255, 255, 255, 0.25); 
            --text-color: #ffffff; 
            --card-bg: rgba(15, 15, 30, 0.85); 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: linear-gradient(-45deg, #FF007A, #4300B1, #00E5FF, #B400FB);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start; /* Changed to top-aligned for better scrolling */
            color: var(--text-color); 
            padding: 15px; 
            overflow-x: hidden; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Full Screen Scrollable Container */
        .app-container { 
            width: 100%; 
            max-width: 800px; /* Widened for full-screen feel */
            background: var(--card-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); 
            border-radius: 24px; 
            padding: 2rem; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            margin: 20px 0;
            transition: all 0.4s ease; 
        }
        
        h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(to right, #00E5FF, #FFEA00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; text-align: center; }
        h2 { font-size: 1.6rem; margin-bottom: 20px; text-align: center;}
        p { color: #e0e0e0; font-size: 1rem; line-height: 1.6; text-align: center;}
        
        /* Dashboard Dynamic List - Removed restricted height */
        .test-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 15px; 
            margin-top: 30px; 
        }

        .test-card { 
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); 
            border: 1px solid var(--glass-border); 
            padding: 22px; 
            border-radius: 18px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: relative;
            overflow: hidden;
        }

        .test-card:hover { 
            transform: scale(1.02); 
            background: rgba(255,255,255,0.12);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.3);
        }

        /* Numbering Circle Style */
        .test-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            margin-right: 15px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .test-info {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }

        .test-title {
            font-weight: 600;
            font-size: 1.15rem;
            color: #fff;
        }
        
        .start-icon { color: var(--accent); font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;}

        /* Rest of Quiz UI Styles */
        .input-group { margin-bottom: 15px; text-align: left; }
        .label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: #00E5FF; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;}
        .glass-input { width: 100%; padding: 15px; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-size: 1rem; outline: none; transition: 0.3s; }
        .glass-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.15); }
        .btn { background: linear-gradient(90deg, #00E5FF, #B400FB); border: none; color: white; padding: 16px; width: 100%; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 20px; transition: all 0.3s; box-shadow: 0 5px 20px rgba(180, 0, 251, 0.4); text-transform: uppercase; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 229, 255, 0.6); }
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(0, 229, 255, 0.1); padding: 12px 18px; border-radius: 12px; border: 1px solid rgba(0, 229, 255, 0.3); }
        .timer-badge { font-family: monospace; font-weight: 700; color: var(--accent); font-size: 1.3rem; }
        .question-text { font-size: 1.25rem; font-weight: 600; margin-bottom: 20px; line-height: 1.6; }
        .option-btn { width: 100%; padding: 18px; margin-bottom: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; text-align: left; color: #fff; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; }
        .option-marker { width: 32px; height: 32px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-weight: 800; flex-shrink: 0; color: var(--primary); }
        .correct { background: rgba(0, 255, 136, 0.25) !important; border-color: #00FF88 !important; }
        .wrong { background: rgba(255, 51, 102, 0.25) !important; border-color: #FF3366 !important; }
        .explanation-box { margin-top: 20px; padding: 18px; background: rgba(0, 229, 255, 0.1); border-left: 4px solid var(--primary); border-radius: 10px; font-size: 1rem; display: none; }
        .score-circle { width: 180px; height: 180px; border-radius: 50%; border: 6px solid var(--accent); margin: 0 auto 20px auto; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); box-shadow: 0 0 30px rgba(255, 234, 0, 0.2); }
        .score-val { font-size: 4rem; font-weight: 800; }
        .hidden { display: none !important; }
        .loading-text { text-align: center; color: var(--primary); font-weight: 600; padding: 40px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-container" id="app">
    
    <div id="view-login" class="hidden">
        <h1>Student Portal</h1>
        <p>Enter your details once to access the dashboard</p>
        
        <div class="input-group" style="margin-top: 25px;">
            <span class="label">Full Name</span>
            <input type="text" id="inp-name" class="glass-input" placeholder="Your Name">
        </div>
        
        <div class="input-group">
            <span class="label">Qualification</span>
            <select id="inp-qual" class="glass-input">
                <option value="Engineer">Engineer</option>
                <option value="Sub-Engineer">Sub-Engineer</option>
                <option value="Asst. Sub-Engineer">Asst. Sub-Engineer</option>
            </select>
        </div>

        <div class="input-group">
            <span class="label">Unique Code</span>
            <input type="tel" id="inp-code" class="glass-input" placeholder="5-digit code">
        </div>

        <div class="input-group">
            <span class="label">Verified Password</span>
            <input type="password" id="inp-pass" class="glass-input" placeholder="Verifying..." readonly>
        </div>

        <button class="btn" id="btn-verify" onclick="App.verifyAndLogin()">Verify & Enter Dashboard</button>
        <p id="auth-msg" style="margin-top: 15px; display: none; font-weight: 600;"></p>
    </div>

    <div id="view-dash" class="hidden">
        <h2 id="greet-msg" style="color: var(--primary); margin-bottom: 5px;">Namaste!</h2>
        <p>Pick a mock test to begin your practice session.</p>
        
        <div class="test-grid" id="test-list-container">
            <div class="loading-text">Loading Test Database...</div>
        </div>
        
        </div>

    <div id="view-quiz" class="hidden">
        <div id="praise-txt" style="font-size: 1.4rem; font-weight: 800; text-align: center; margin-bottom: 20px;">Get Ready!</div>

        <div class="info-bar">
            <span>Q: <span id="q-idx" style="color:var(--primary)">1</span> / <span id="q-total">0</span></span>
            <span class="timer-badge" id="timer">45:00</span>
        </div>

        <div id="q-container">
            <div class="question-text" id="q-text">Loading question...</div>
            <div id="opts-list"></div>
            <div class="explanation-box" id="exp-box"></div>
        </div>

        <button class="btn hidden" id="btn-next" onclick="App.next()">Next Question ➔</button>
    </div>

    <div id="view-result" class="hidden" style="text-align: center;">
        <h2 style="color: var(--primary);">Exam Result</h2>
        <div class="score-circle">
            <span class="score-val" id="res-score">0</span>
            <span style="font-size: 0.9rem; text-transform: uppercase; color: #aaa;">Correct</span>
        </div>
        <h3 id="res-pct" style="color: var(--accent); font-size: 2.2rem; margin-bottom: 20px;">0%</h3>
        <button class="btn" onclick="App.dash()">Back to List</button>
    </div>
</div>

<script>
const CFG = {
    authScript: "https://script.google.com/macros/s/AKfycbyEhT6_yt0k0yrRXVuHVg6YZ4WqtFPd08n8CO1EnPQEzOTLeFmu7by36pDauwUcIgJd/exec"
};

const KEYS = { user: "Bahubali" };

const PRAISE = {
    good: ["Genius!", "Amazing!", "Excellent!", "Fantastic!", "Great Job!"],
    bad: ["Keep trying!", "Don't give up!", "You'll get the next one!", "Stay focused!"]
};

const App = {
    state: { user: null, currentTestName: "", quiz: [], curr: 0, score: 0, timer: null },

    save: (k, v) => localStorage.setItem(k, v),
    load: (k) => localStorage.getItem(k),

    init: () => {
        const stored = App.load(KEYS.user);
        if(stored) {
            App.state.user = JSON.parse(stored);
            App.dash();
        } else {
            document.getElementById('view-login').classList.remove('hidden');
        }
    },

    verifyAndLogin: () => {
        const n = document.getElementById('inp-name').value.trim();
        const q = document.getElementById('inp-qual').value;
        const c = document.getElementById('inp-code').value.trim();
        const msg = document.getElementById('auth-msg');
        const btn = document.getElementById('btn-verify');

        if(!n || !c) {
            msg.innerText = "Error: Name & Code required";
            msg.style.display = 'block'; msg.style.color = "#FF3366";
            return;
        }

        btn.disabled = true; btn.innerText = "Verifying...";
        
        fetch(`${CFG.authScript}?code=${c}&name=${n}&qual=${q}`)
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById('inp-pass').value = data.password;
                App.state.user = { name: n, qual: q, code: c };
                App.save(KEYS.user, JSON.stringify(App.state.user));
                setTimeout(() => App.dash(), 800);
            } else {
                btn.disabled = false; btn.innerText = "Verify & Login";
                msg.style.display = 'block'; msg.style.color = "#FF3366";
                msg.innerText = "Invalid Code or Already Used";
            }
        })
        .catch(() => {
            btn.disabled = false; btn.innerText = "Retry Login";
            msg.style.display = 'block'; msg.innerText = "Connection error.";
        });
    },

    dash: () => {
        document.querySelectorAll('#app > div').forEach(el => el.classList.add('hidden'));
        document.getElementById('view-dash').classList.remove('hidden');
        document.getElementById('greet-msg').innerText = `Namaste, ${App.state.user.name.split(' ')[0]}!`;
        
        const container = document.getElementById('test-list-container');
        container.innerHTML = '<div class="loading-text">Fetching available tests...</div>';

        fetch('list.json')
            .then(res => res.json())
            .then(list => {
                container.innerHTML = '';
                list.forEach((testName, index) => {
                    const btn = document.createElement('div');
                    btn.className = 'test-card';
                    const displayName = testName.replace(/_/g, ' '); 
                    
                    // Added Numbering logic (index + 1)
                    btn.innerHTML = `
                        <div class="test-info">
                            <div class="test-number">${index + 1}</div>
                            <div class="test-title">${displayName}</div>
                        </div>
                        <div class="start-icon">START <span>▶</span></div>
                    `;
                    btn.onclick = () => App.fetchMCQ(testName);
                    container.appendChild(btn);
                });
            })
            .catch(() => {
                container.innerHTML = `<div class="loading-text" style="color:#FF3366">Error: list.json not found!</div>`;
            });
    },

    fetchMCQ: (fileName) => {
        fetch(`${fileName}.json`)
            .then(res => res.json())
            .then(data => App.start(data))
            .catch(() => alert("Could not load " + fileName));
    },

    start: (testData) => {
        App.state.curr = 0; App.state.score = 0; 
        App.state.quiz = testData.map(q => ({
            ...q,
            shuffledOpts: q.o.map((txt, i) => ({ t: txt, c: i === q.a })).sort(() => Math.random() - 0.5)
        })).sort(() => Math.random() - 0.5);

        document.getElementById('view-dash').classList.add('hidden');
        document.getElementById('view-quiz').classList.remove('hidden');
        document.getElementById('q-total').innerText = App.state.quiz.length;
        App.timer(45 * 60);
        App.render();
    },

    render: () => {
        const q = App.state.quiz[App.state.curr];
        document.getElementById('q-idx').innerText = App.state.curr + 1;
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('exp-box').style.display = 'none';
        document.getElementById('btn-next').classList.add('hidden');
        
        const list = document.getElementById('opts-list');
        list.innerHTML = '';
        q.shuffledOpts.forEach((opt, i) => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerHTML = `<div class="option-marker">${String.fromCharCode(65+i)}</div>${opt.t}`;
            btn.onclick = () => App.check(btn, opt, q);
            list.appendChild(btn);
        });
    },

    check: (btn, opt, q) => {
        const all = document.querySelectorAll('.option-btn');
        all.forEach(b => { b.onclick = null; b.style.opacity = '0.5'; });
        btn.style.opacity = '1';
        
        const praise = document.getElementById('praise-txt');
        if(opt.c) {
            btn.classList.add('correct'); App.state.score++;
            praise.innerText = PRAISE.good[Math.floor(Math.random()*PRAISE.good.length)];
            praise.style.color = "#00FF88";
        } else {
            btn.classList.add('wrong');
            all.forEach((b, i) => { if(q.shuffledOpts[i].c) b.classList.add('correct'); });
            praise.innerText = PRAISE.bad[Math.floor(Math.random()*PRAISE.bad.length)];
            praise.style.color = "#FF3366";
        }

        if(q.e) {
            document.getElementById('exp-box').innerHTML = `<b>Explanation:</b> ${q.e}`;
            document.getElementById('exp-box').style.display = 'block';
        }
        document.getElementById('btn-next').classList.remove('hidden');
    },

    next: () => {
        App.state.curr++;
        if(App.state.curr < App.state.quiz.length) App.render();
        else App.finish();
    },

    timer: (sec) => {
        if(App.state.timer) clearInterval(App.state.timer);
        App.state.timer = setInterval(() => {
            sec--;
            let m = Math.floor(sec/60), s = sec%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
            if(sec<=0) App.finish();
        }, 1000);
    },

    finish: () => {
        clearInterval(App.state.timer);
        document.getElementById('view-quiz').classList.add('hidden');
        document.getElementById('view-result').classList.remove('hidden');
        const pct = Math.round((App.state.score / App.state.quiz.length) * 100);
        document.getElementById('res-score').innerText = App.state.score;
        document.getElementById('res-pct').innerText = `${pct}% Accuracy`;
    }
};

window.onload = App.init;
</script>
</body>
</html>
